AWSTemplateFormatVersion: '2010-09-09'
Description: A CodePipeline to build the PyWeatherLambda-Demo

Parameters:
  BranchName:
    Description: CodeCommit branch name 
    Type: String
    Default: main
  RepositoryName:
    Description: CodeCommit repository name
    Type: String
    Default: PyWeather-Demo
    
Resources:

#
#  ____  ____ 
# / ___)( __ \
# \___ \ (__ (
# (____/(____/
#

  ArtifactStoreBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'AES256'

#
#  ___  __  ____  ____  ____  _  _  __  __    ____ 
# / __)/  \(    \(  __)(  _ \/ )( \(  )(  )  (    \
#( (__(  O )) D ( ) _)  ) _ () \/ ( )( / (_/\ ) D (
# \___)\__/(____/(____)(____/\____/(__)\____/(____/
#

  BuildLambdaProject:
    Type: AWS::CodeBuild::Project
    Properties:
        Name: PyWeather-Demo-Build
        Artifacts:
            Type: CODEPIPELINE
        Environment:
            ComputeType: BUILD_GENERAL1_SMALL
            Image: aws/codebuild/amazonlinux2-x86_64-standard:3.0
            PrivilegedMode: true
            Type: LINUX_CONTAINER
            EnvironmentVariables:
            - Name: BUCKET_NAME
              Type: PLAINTEXT
              Value: !Ref ArtifactStoreBucket
        ServiceRole:
            Fn::GetAtt:
            - BuildRole
            - Arn
        Source:
            # Assume buildspec.yaml is in the source root directory
            Type: CODEPIPELINE
  
#
#  ___  __  ____  ____  ____  __  ____  ____  __    __  __ _  ____ 
# / __)/  \(    \(  __)(  _ \(  )(  _ \(  __)(  )  (  )(  ( \(  __)
#( (__(  O )) D ( ) _)  ) __/ )(  ) __/ ) _) / (_/\ )( /    / ) _) 
# \___)\__/(____/(____)(__)  (__)(__)  (____)\____/(__)\_)__)(____) 
# 

  AppPipeline:
    Type: 'AWS::CodePipeline::Pipeline'
    Properties:
      Name: PyWeather-Demo-Pipeline
      RoleArn: !GetAtt 
        - CodePipelineServiceRole
        - Arn
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                BranchName: !Ref BranchName
                RepositoryName: !Ref RepositoryName
                PollForSourceChanges: false
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: BuildLambda
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildArtifact
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref BuildLambdaProject
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: DeployLambda
              InputArtifacts:
                - Name: BuildArtifact
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !GetAtt [CFNRole, Arn]
                StackName: "PyWeather-Demo"
                TemplatePath: "BuildArtifact::package.yaml"
                TemplateConfiguration: "BuildArtifact::stackparams.json"
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactStoreBucket

#
#  ___  __  ____  ____  ____  ____  ____  __     __  _  _ 
# / __)/  \(    \(  __)(    \(  __)(  _ \(  )   /  \( \/ )
#( (__(  O )) D ( ) _)  ) D ( ) _)  ) __// (_/\(  O ))  / 
# \___)\__/(____/(____)(____/(____)(__)  \____/ \__/(__/ 
#

  FiftyFiftyCanary: 
    Type: 'AWS::CodeDeploy::DeploymentConfig'
    Properties: 
      DeploymentConfigName: "FiftyFiftyCanary"
      ComputePlatform: Lambda
      TrafficRoutingConfig:
        Type: "TimeBasedCanary"
        TimeBasedCanary:
          # 5 Minutes - Plenty of time to talk it out, and show Aliases and Deployment in progress in the Console
          CanaryInterval: 5
          CanaryPercentage: 50
#
#  ___  __     __   _  _  ____  _  _   __  ____  ___  _  _ 
# / __)(  )   /  \ / )( \(    \/ )( \ / _\(_  _)/ __)/ )( \
#( (__ / (_/\(  O )) \/ ( ) D (\ /\ //    \ )( ( (__ ) __ (
# \___)\____/ \__/ \____/(____/(_/\_)\_/\_/(__) \___)\_)(_/
#
# 

  AmazonCloudWatchEventRule:
    Type: 'AWS::Events::Rule'
    Properties:
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - CodeCommit Repository State Change
        resources:
          - !Join 
            - ''
            - - 'arn:aws:codecommit:'
              - !Ref 'AWS::Region'
              - ':'
              - !Ref 'AWS::AccountId'
              - ':'
              - !Ref RepositoryName
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - main
      Targets:
        - Arn: !Join 
            - ''
            - - 'arn:aws:codepipeline:'
              - !Ref 'AWS::Region'
              - ':'
              - !Ref 'AWS::AccountId'
              - ':'
              - !Ref AppPipeline
          RoleArn: !GetAtt 
            - AmazonCloudWatchEventRole
            - Arn
          Id: codepipeline-AppPipeline


#
#  __   __   _  _ 
# (  ) / _\ ( \/ )
#  )( /    \/ \/ \
# (__)\_/\_/\_)(_/
#
#

  AmazonCloudWatchEventRole:
      Type: 'AWS::IAM::Role'
      Properties:
        AssumeRolePolicyDocument:
          Version: 2012-10-17
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - events.amazonaws.com
              Action: 'sts:AssumeRole'
        Path: /
        Policies:
          - PolicyName: cwe-pipeline-execution
            PolicyDocument:
              Version: 2012-10-17
              Statement:
                - Effect: Allow
                  Action: 'codepipeline:StartPipelineExecution'
                  Resource: !Join 
                    - ''
                    - - 'arn:aws:codepipeline:'
                      - !Ref 'AWS::Region'
                      - ':'
                      - !Ref 'AWS::AccountId'
                      - ':'
                      - !Ref AppPipeline

  CodePipelineArtifactStoreBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref ArtifactStoreBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: DenyInsecureConnections
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: !Join 
              - ''
              - - !GetAtt 
                  - ArtifactStoreBucket
                  - Arn
                - /*
            Condition:
              Bool:
                'aws:SecureTransport': false
                    
  CodePipelineServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: AWS-CodePipeline-Service-3
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'codecommit:CancelUploadArchive'
                  - 'codecommit:GetBranch'
                  - 'codecommit:GetCommit'
                  - 'codecommit:GetUploadArchiveStatus'
                  - 'codecommit:UploadArchive'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'codedeploy:CreateDeployment'
                  - 'codedeploy:GetApplicationRevision'
                  - 'codedeploy:GetDeployment'
                  - 'codedeploy:GetDeploymentConfig'
                  - 'codedeploy:RegisterApplicationRevision'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'codebuild:BatchGetBuilds'
                  - 'codebuild:StartBuild'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'devicefarm:ListProjects'
                  - 'devicefarm:ListDevicePools'
                  - 'devicefarm:GetRun'
                  - 'devicefarm:GetUpload'
                  - 'devicefarm:CreateUpload'
                  - 'devicefarm:ScheduleRun'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                  - 'lambda:ListFunctions'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'iam:PassRole'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'elasticbeanstalk:*'
                  - 'ec2:*'
                  - 'elasticloadbalancing:*'
                  - 'autoscaling:*'
                  - 'cloudwatch:*'
                  - 's3:*'
                  - 'sns:*'
                  - 'cloudformation:*'
                  - 'rds:*'
                  - 'sqs:*'
                  - 'ecs:*'
                Resource: '*'

  BuildRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: AWS-CodeBuild-Role-3
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'codebuild:*'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                  - 'lambda:ListFunctions'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'iam:PassRole'
                Resource: '*'
              - Effect: Allow
                Action:
                - 'secretsmanager:DescribeSecret'
                Resource: !Join 
                  - ''
                  - - 'arn:aws:secretsmanager:'
                    - !Ref 'AWS::Region'
                    - ':'
                    - !Ref 'AWS::AccountId'
                    - ':'
                    - 'secret:openweather-api-key*'
              - Effect: Allow
                Action:
                  - 'cloudwatch:*'
                  - 'logs:CreateLogStream'
                  - 'logs:CreateLogGroup'
                  - 'logs:PutLogEvents'
                  - 's3:*'
                Resource: '*'

  CFNRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: AWS-CFN-Role
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'lambda:*'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'apigateway:*'
                  - 'apigateway:PUT'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'iam:PassRole'
                  - 'iam:CreateRole'
                  - 'iam:DeleteRole'
                  - 'iam:AttachRolePolicy'
                  - 'iam:DeleteRolePolicy'
                  - 'iam:DetachRolePolicy'
                  - 'iam:PutRolePolicy'
                  - 'iam:GetRole'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'cloudformation:CreateChangeSet'
                  - 'cloudformation:ExecuteChangeSet'
                  - 'cloudwatch:*'
                  - 'codedeploy:CreateApplication'
                  - 'codedeploy:DeleteApplication'
                  - 'codedeploy:CreateDeploymentGroup'
                  - 'codedeploy:DeleteDeploymentGroup'
                  - 'codedeploy:UpdateDeploymentGroup'
                  - 'codedeploy:GetDeploymentGroup'
                  - 'codedeploy:CreateDeployment'
                  - 'codedeploy:DeleteDeployment'
                  - 'codedeploy:UpdateDeployment'
                  - 'codedeploy:GetDeploymentConfig'
                  - 'codedeploy:GetDeployment'
                  - 'codedeploy:RegisterApplicationRevision'
                  - 's3:*'
                Resource: '*'

