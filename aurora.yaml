AWSTemplateFormatVersion: '2010-09-09'
Transform: 
  - AWS::Serverless-2016-10-31
  - AWS::SecretsManager-2020-07-23
Description: >-
    Creates an Aurora Serverless (MySql) database and uses a CFN Custom Resource to initialize it with a schema.

Parameters:
  DBUsername:
    NoEcho: 'true'
    Description: Username for MySQL database access
    Type: String
    Default: weatheradmin
    MinLength: '1'
    MaxLength: '16'
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ConstraintDescription: must begin with a letter and contain only alphanumeric characters.
    
  DBPassword:
    NoEcho: 'true'
    Description: Password MySQL database access
    Type: String
    Default: Password123
    MinLength: '8'
    MaxLength: '41'
    AllowedPattern: '[a-zA-Z0-9]*'
    ConstraintDescription: must contain only alphanumeric characters.
    
  VpcId:
    Description: VPC ID
    Type: String
    
  Subnets:
    Description: Choose Subnets for the RDSCluster. Must be Private subnets with NAT GW, or S3 Gateway for access to S3 (for CustomResource schema setup)
    Type: String

  APIKeySecretArn:
    Type: String
    Default: "arn:aws:secretmanager:REGION:ACCOUNTID:secret:SECRETNAME"
    Description: "Enter the ARN of the Secrets Manager Secret that holds the OpenWeatherMap API Key (You must create this yourself!)"

Resources:

  DBSubnetGroup: 
    Type: "AWS::RDS::DBSubnetGroup"
    Properties: 
      DBSubnetGroupDescription: Subnet group for Aurora Serverless
      SubnetIds: !Split [',', !Ref Subnets]
  
  DBSecret:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Description: Secret for the database user and password
      GenerateSecretString:
        SecretStringTemplate: '{"username":"weatheradmin"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludePunctuation: true
        
  DBSecretRotation:
    Type: 'AWS::SecretsManager::RotationSchedule'
    Properties:
      HostedRotationLambda:
        # See here: https://docs.aws.amazon.com/secretsmanager/latest/userguide/reference_available-rotation-templates.html#sar-template-mysql-singleuser
        RotationType: MySQLSingleUser
        # We have to specify this because the Lambda will need to be connected to the VPC in order to change the password.
        # https://github.com/aws-samples/aws-secrets-manager-rotation-lambdas/blob/master/SecretsManagerRDSMySQLRotationSingleUser/lambda_function.py
        VpcSecurityGroupIds: !ImportValue 'pyweather-aurora-DBSecurityGroup'
        VpcSubnetIds: !Ref Subnets
      RotationRules:
        AutomaticallyAfterDays: 30
        Duration: 2h
        # For more precise control, consider using a cron expression.
        #ScheduleExpression: "cron(0 1 * * ? *)"
      SecretId: !Ref DBSecret
  
  SecretTargetAttachment:
    Type: 'AWS::SecretsManager::SecretTargetAttachment'
    DependsOn: 
      - RDSCluster
      - DBSecret
    Properties:
      SecretId: !Ref DBSecret
      TargetId: !Ref RDSCluster
      TargetType: "AWS::RDS::DBCluster"

  RDSCluster:
    Type: 'AWS::RDS::DBCluster'
    Properties:
      MasterUsername: !Join ['', ['{{resolve:secretsmanager:', !Ref DBSecret, ':SecretString:username}}' ]]
      MasterUserPassword: !Join ['', ['{{resolve:secretsmanager:', !Ref DBSecret, ':SecretString:password}}' ]]
      Engine: aurora
      EngineVersion: 5.6.10a
      # Serverless
      EngineMode: serverless
      # So we can use Data API / Query Editor in the console, if we want.
      EnableHttpEndpoint: true
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !ImportValue 'pyweather-aurora-DBSecurityGroup'
      ScalingConfiguration:
        AutoPause: true
        MinCapacity: 1
        MaxCapacity: 4
        SecondsUntilAutoPause: 1000

  CustomResource:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: RDSCluster
    Properties:
      RDSEndpoint: !GetAtt RDSCluster.Endpoint.Address
      RDSPort: !GetAtt RDSCluster.Endpoint.Port
      DBSecret: !Ref DBSecret
      ServiceToken: !Join 
        - ''
        - - 'arn:aws:lambda:'
          - !Ref 'AWS::Region'
          - ':'
          - !Ref 'AWS::AccountId'
          - ':function:'
          - !ImportValue 'pyweather-aurora-LambdaForSchema'

  # Add a Resource Policy on the Secret so that LambdaForSchema can access it.
  DBSecretResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      BlockPublicPolicy: True
      SecretId:
        Ref: DBSecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
        - Resource: "*"
          Action: secretsmanager:GetSecretValue
          Effect: Allow
          Principal:
            AWS: !ImportValue "pyweather-aurora-CustomResourceRoleArn"

  PyWeatherAurora:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.8
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          DB_SECRET_ARN: !Ref DBSecret
          RDS_ENDPOINT: !GetAtt RDSCluster.Endpoint.Address
      VpcConfig:
        SecurityGroupIds: 
          - !ImportValue "pyweather-aurora-DBSecurityGroup"
        SubnetIds: !Split [',', !Ref Subnets]
      Events:
        PyWeatherDemo:
          Type: Api 
          Properties:
            Path: /
            Method: get
            
  LambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: FunctionPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # These things needed for VPC access.
              - Effect: Allow
                Action:
                  - 'ec2:CreateNetworkInterface'
                  - 'ec2:DescribeNetworkInterfaces'
                  - 'ec2:DeleteNetworkInterface'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                Resource: 
                  - !Ref APIKeySecretArn
                  - !Ref DBSecret